server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # CFG-05 (docs/20-08-26/AUDITORIA_END_TO_END.md): esta app no tenía ningún header de
    # seguridad HTTP. Nginx no hereda add_header de un bloque padre en un location que ya
    # define el suyo propio, así que se repite en cada location (gotcha conocido de nginx)
    # en vez de confiar en la herencia. Sin Strict-Transport-Security: este nginx sirve
    # HTTP plano, no termina TLS -- si algún día hay un reverse proxy con TLS delante, HSTS
    # se agrega ahí, no acá.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'" always;

    # SPA: todas las rutas van al index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'" always;
    }

    # Bundles estáticos con cache largo (dist/static/, ver vite.config.ts assetsDir)
    # B-NUEVO-1 (docs/20-08-26/AUDITORIA_END_TO_END_2.md): faltaban Referrer-Policy y CSP acá
    # -- mismo gotcha de nginx explicado arriba (add_header no se hereda de un location padre
    # una vez que este location define los suyos propios), quedó parcial la primera vez.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'" always;
    }

    # Proxy de /api al backend dentro de la red Docker
    # El frontend (Nginx) se comunica con el backend por red interna (puerto 8080)
    # El usuario accede por localhost:3000 → Nginx → backend:8080 (interno)
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
