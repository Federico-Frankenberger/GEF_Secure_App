# DT-07 (docs/deuda-tecnica.md): antes ninguna dependencia propia del proyecto
# tenía escaneo automatizado -- irónico para un proyecto de gestión de
# vulnerabilidades. Cubre los 2 ecosistemas reales del repo: Gradle (backend)
# y npm (frontend). Requiere que el repo esté en GitHub con Dependabot
# habilitado (Settings > Security > Dependabot) para que esto tenga efecto --
# el archivo por sí solo no activa nada si esa opción está apagada.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    ignore:
      # OpenPDF 3.x migró el paquete de com.lowagie.text a org.openpdf --
      # rompe la generación de reportes PDF (sección Informes). Ver el
      # comentario en build.gradle. No proponer major bumps para esta lib.
      - dependency-name: "com.github.librepdf:openpdf"
        update-types: ["version-update:semver-major"]
      # springdoc-openapi por encima de 2.6.x ya rompe -- probado en vivo
      # (2026-08-23) con 2.9.0 (no solo 3.x): falta
      # org.springframework.web.servlet.resource.LiteWebJarsResourceResolver,
      # una clase que no existe en el Spring Framework que trae Spring Boot
      # 3.3.4. No es un problema de "major", es un problema de compatibilidad
      # real -- bloquear también minor hasta que el proyecto migre de Spring Boot.
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # @vitejs/plugin-react 6.x exige vite ^8.0.0 -- probado en vivo
      # (2026-08-23): npm ERESOLVE, este proyecto usa vite ^5.4.8. Migrar
      # de mayor implica actualizar Vite también, fuera de alcance de un
      # bump aislado de este plugin.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # jsdom 30.x depende de undici@8, que exige Node >=22.19.0 -- probado
      # en vivo (2026-08-23): funciona con warning en Node 22.15 local, pero
      # el CI usa Node 20 (ver ci.yml). Además el setup del entorno de test
      # se volvió ~8x más lento (8s -> 62s). No vale el riesgo todavía.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
