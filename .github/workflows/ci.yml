# DT-10 (docs/deuda-tecnica.md): antes los tests solo corrían manualmente --
# nada bloqueaba un merge con tests rotos. Un job por cada mitad real del
# proyecto (backend Gradle, frontend npm), corriendo en paralelo.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    # El proyecto no usa Flyway/Liquibase (ADR-0002): el esquema real vive en
    # init/*.sql. Los tests (BackendApplicationTests carga el contexto completo,
    # ScanReportRepositoryTest es @DataJpaTest) necesitan una base Postgres real
    # con ese esquema aplicado -- no alcanza con mockear todo. Mismas credenciales
    # que el fallback de application.properties para no tener que overridear nada.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: security
          POSTGRES_USER: security_user
          POSTGRES_PASSWORD: security_pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U security_user -d security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Aplicar esquema (init/*.sql, en orden)
        working-directory: .
        env:
          PGPASSWORD: security_pass
        run: |
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client
          for f in $(ls init/*.sql | sort); do
            echo "-- aplicando $f"
            psql -h localhost -p 5433 -U security_user -d security -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run tests
        run: ./gradlew test --no-daemon
      - name: Publish test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  # Plan de confiabilidad (2026-08-24): la logica JS critica embebida en los Code
  # nodes de n8n (workflows/*.json) no tenia ningun test -- se verificaba a mano en
  # cada auditoria end-to-end. Paquete Node aislado (no comparte nada con frontend/),
  # ver workflows/tests/ para el detalle de como se extrae y valida la logica real.
  n8n-logic:
    name: n8n workflow logic (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflows/tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: workflows/tests/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
