version: '3.8'

services:

  # ── Base de Datos ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: vuln_postgres
    restart: always
    environment:
      POSTGRES_DB: security
      POSTGRES_USER: security_user
      POSTGRES_PASSWORD: security_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    # CRÍTICO: healthcheck para que los demás servicios esperen
    # que postgres esté realmente listo para aceptar conexiones,
    # no solo que el contenedor haya arrancado
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_user -d security"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Automatización n8n ───────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n
    container_name: vuln_n8n
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=security_user
      - DB_POSTGRESDB_PASSWORD=security_pass
      - N8N_ENCRYPTION_KEY=gef_secure_2026_master_key
    depends_on:
      postgres:
        condition: service_healthy   # espera el healthcheck

  # ── pgAdmin ──────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: vuln_pgadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend GEF Secure ───────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: gef_backend
    restart: always
    ports:
      - "8081:8080"    # 8081 hacia afuera para no chocar con pgAdmin en 8080
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/security
      SPRING_DATASOURCE_USERNAME: security_user
      SPRING_DATASOURCE_PASSWORD: security_pass
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/tu-id
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy   # espera que postgres pase el healthcheck
      n8n:
        condition: service_started   # n8n no tiene healthcheck, alcanza con started

  # ── Frontend GEF Secure ──────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: gef_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
    external: true
    name: vuln-project_pgdata
  n8n_data:
