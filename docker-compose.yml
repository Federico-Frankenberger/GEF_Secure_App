# ── Red dedicada del stack ────────────────────────────────────────────────────
networks:
  gef_net:
    driver: bridge

services:

  # ── Base de Datos ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: vuln_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host 5433 -> contenedor 5432: en esta máquina hay un Postgres nativo
      # de Windows escuchando también en 5432, y competía con este mapeo
      # (docker exec funcionaba, pero cualquier conexión desde el host por
      # TCP a localhost:5432 caía en el proceso nativo, no en este contenedor).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - gef_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Automatización n8n (imagen propia con bootstrap automático) ───────────────
  n8n:
    build:
      context: ./n8n
      args:
        N8N_VERSION: ${N8N_VERSION}
    container_name: vuln_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/setup/workflows:ro
      - ./n8n-provisioning:/setup/credentials:ro
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_PORT=5678
      - WEBHOOK_URL=${N8N_WEBHOOK_PUBLIC_URL}
      - N8N_DIAGNOSTICS_ENABLED=false
      # n8n bloquea $env en expresiones por defecto -- necesario para que
      # Persist_Scan_Statistics lea N8N_INTERNAL_TOKEN dinamicamente (trazabilidad).
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_OWNER_EMAIL=${N8N_OWNER_EMAIL}
      - N8N_OWNER_FIRST_NAME=${N8N_OWNER_FIRST_NAME}
      - N8N_OWNER_LAST_NAME=${N8N_OWNER_LAST_NAME}
      - N8N_OWNER_PASSWORD=${N8N_OWNER_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - N8N_INTERNAL_TOKEN=${N8N_INTERNAL_TOKEN}
    networks:
      - gef_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /rest/settings (no requiere auth) en vez de /healthz/readiness: este
      # ultimo pasa a 200 antes de que el router REST este montado del todo
      # (condicion de carrera verificada), lo que dejaria pasar el healthcheck
      # antes de que /webhook/* este realmente servible para el backend.
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/rest/settings || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ── pgAdmin ──────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: vuln_pgadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    networks:
      - gef_net
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend GEF Secure ───────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: gef_backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/auditoria-automatizada
      N8N_INJECT_WEBHOOK_URL: http://n8n:5678/webhook/inject-test-asset
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      N8N_INTERNAL_TOKEN: ${N8N_INTERNAL_TOKEN}
    networks:
      - gef_net
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy

  # ── Frontend GEF Secure ──────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: gef_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - gef_net
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  n8n_data:
