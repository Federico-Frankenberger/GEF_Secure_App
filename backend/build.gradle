plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.gef'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	runtimeOnly 'org.postgresql:postgresql'

	// Generacion de informes en PDF (seccion Informes) -- linea 1.3.x, paquete
	// clasico com.lowagie.text (OpenPDF 3.x lo migro a org.openpdf y no es compatible).
	implementation 'com.github.librepdf:openpdf:3.0.5'

	// JWT (Fase 3 - autenticacion)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// MapStruct (debe ir despues de Lombok)
	implementation 'org.mapstruct:mapstruct:1.6.2'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += [
		'-Amapstruct.defaultComponentModel=spring',
		'-Amapstruct.unmappedTargetPolicy=IGNORE'
	]
}

// El JDBC driver de Postgres le pasa al servidor el timezone por defecto de la
// JVM en el handshake de conexión. En Windows, algunos locales reportan el
// alias legado "America/Buenos_Aires" en vez del nombre IANA canónico
// "America/Argentina/Buenos_Aires", que es el único que trae el tzdata de la
// imagen postgres:15 -> la conexión fallaba con "invalid value for parameter
// TimeZone". Se fija explícitamente para las tareas que corren contra la base
// real (test, bootRun) sin tocar la configuración de timezone del sistema.
tasks.withType(Test).configureEach {
	systemProperty 'user.timezone', 'UTC'
}
tasks.withType(JavaExec).configureEach {
	systemProperty 'user.timezone', 'UTC'
}

tasks.named('test') {
	useJUnitPlatform()
}
