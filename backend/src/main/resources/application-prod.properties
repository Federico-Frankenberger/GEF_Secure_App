# ── Perfil "prod" (opt-in explícito, activar con SPRING_PROFILES_ACTIVE=prod) ──
# CFG-06 (docs/20-08-26/AUDITORIA_END_TO_END.md): Swagger/OpenAPI documenta
# endpoints, DTOs y parámetros completos -- útil en desarrollo, innecesario
# expuesto públicamente en un despliegue real.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Igual que en desarrollo, pero sin el ruido de DEBUG por defecto.
logging.level.com.gef.gefsecureapp=INFO
