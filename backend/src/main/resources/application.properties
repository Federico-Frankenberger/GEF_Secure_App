# ── Datasource ───────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/security}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:security_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:security_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP — reintentos de conexión al arrancar ────────────────────────────
# Reintenta conectarse hasta 10 veces con 5s entre intentos.
# Cubre el caso donde postgres todavía está corriendo los init scripts
# cuando el backend ya arrancó (depends_on no espera que postgres esté "listo")
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-init-sql=SELECT 1

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# validate: Hibernate verifica que las tablas existan (las crea el init SQL de Docker)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── Multipart (importacion de inventario SBOM) ───────────────────────────────
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ── Virtual Threads (Java 21) ────────────────────────────────────────────────
spring.threads.virtual.enabled=true

# ── Swagger ──────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── n8n Webhook ──────────────────────────────────────────────────────────────
n8n.webhook.url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/gef-scan}
# Flujo inyector (§11.16): crea un activo de prueba con software real y vulnerable,
# para probar escaneos sin depender de que el inventario real tenga algo detectable.
n8n.inject-webhook.url=${N8N_INJECT_WEBHOOK_URL:http://localhost:5678/webhook/inject-test-asset}
# Token compartido para que n8n reporte el resultado de un escaneo (POST
# /api/webhook/scan-report) sin necesitar un JWT de usuario -- ver SecurityConfig.
n8n.internal-token=${N8N_INTERNAL_TOKEN:dev-only-insecure-internal-token}

# ── CORS ─────────────────────────────────────────────────────────────────────
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── JWT (Fase 3) ─────────────────────────────────────────────────────────────
# El fallback es SOLO para levantar el backend local sin configurar nada;
# en cualquier entorno real hay que setear JWT_SECRET (openssl rand -base64 32).
jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-please-override-in-prod-32chars-min}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.gef.gefsecureapp=DEBUG
logging.level.org.springframework.web=INFO
