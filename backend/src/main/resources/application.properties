# ── Datasource ───────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/security}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:security_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:security_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP — reintentos de conexión al arrancar ────────────────────────────
# Reintenta conectarse hasta 10 veces con 5s entre intentos.
# Cubre el caso donde postgres todavía está corriendo los init scripts
# cuando el backend ya arrancó (depends_on no espera que postgres esté "listo")
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-init-sql=SELECT 1

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# validate: Hibernate verifica que las tablas existan (las crea el init SQL de Docker)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── Virtual Threads (Java 21) ────────────────────────────────────────────────
spring.threads.virtual.enabled=true

# ── Swagger ──────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── n8n Webhook ──────────────────────────────────────────────────────────────
n8n.webhook.url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/gef-scan}

# ── CORS ─────────────────────────────────────────────────────────────────────
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.gef.gefsecureapp=DEBUG
logging.level.org.springframework.web=INFO
